name: Playwright SDET Framework CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─── Lint & Type Check ────────────────────────────────────────────────────
  quality:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  # ─── Playwright Tests — Matrix per browser ────────────────────────────────
  test:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    strategy:
      fail-fast: false # Keep other browsers running even if one fails
      matrix:
        # On PRs run only Chromium to save CI minutes.
        # On push to main/develop, run the full matrix.
        # Manually triggered runs respect the 'browser' input.
        browser:
          - chromium
          # firefox and webkit are included in the full pipeline
          # Remove the comment below to enable them on every PR:
          # - firefox
          # - webkit

    env:
      CI: 'true'
      # Secrets are injected from GitHub repository / environment secrets.
      # NEVER hardcode values here.
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_ENV: ${{ secrets.TEST_ENV || 'staging' }}
      WORKERS: '2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      # ── Artefacts — always collected even on failure ──────────────────────

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: reports/allure/results/
          retention-days: 14

      - name: Upload test artefacts (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artefacts-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # ─── Full cross-browser gate (only on push to main) ──────────────────────
  cross-browser:
    name: Full Cross-Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    env:
      CI: 'true'
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_ENV: ${{ secrets.TEST_ENV || 'staging' }}
      WORKERS: '2'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-main
          path: playwright-report/
          retention-days: 30

      - name: Upload test artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artefacts-${{ matrix.browser }}-main
          path: test-results/
          retention-days: 14
